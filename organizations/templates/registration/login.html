<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | WomenPregnancy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #f2f6f8;
      color: #263b49;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: white;
      border: 1px solid #e0e8ec;
      border-radius: 16px;
      box-shadow: 0 15px 45px rgba(23,52,72,.08);
    }
    .brand { font-size: 21px; font-weight: 800; color: #173448; }
    .brand span { color: #087e8b; }
    .tagline { margin-top: 6px; font-size: 10px; letter-spacing: 1.5px; color: #697e8a; }
    h1 { margin-top: 30px; font-size: 26px; }
    p { color: #697e8a; line-height: 1.6; }
    label { display: block; font-weight: 650; margin: 17px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd7dd;
      border-radius: 8px;
      font: inherit;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 23px;
      border: 0;
      border-radius: 8px;
      background: #087e8b;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: #a52020; }
    .foot { font-size: 12px; text-align: center; margin-top: 22px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">AFRIVELTA <span>WomenPregnancy</span></div>
    <div class="tagline">ORGANISATION IMPACT HUB</div>

    <h1>Welcome back</h1>
    <p>Sign in to access your organisation workspace.</p>

    {% if form.errors %}
      <p class="error">Sign-in failed. Please check your username and password.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'/' }}">

      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}

      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}

      <button type="submit">Sign in securely</button>
    </form>

    <p class="foot">AFRIVELTA Technology · WomenPregnancy</p>
  </main>
</body>
</html>
